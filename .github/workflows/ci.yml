name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Three jobs run side by side; none waits for another.
  test:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - name: Run tests
        run: zig build test --summary all

  checks:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - name: Zig is formatted
        run: zig fmt --check src build.zig
      - name: Build
        run: zig build
      - name: Sources are formatted
        run: zig-out/bin/x17 fmt --check examples/*.sm
      - name: Instruction reference is current
        run: zig-out/bin/x17 doc --check docs/sm1/reference.md

  action-selftest:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Consume setup-x17 from this checkout
        uses: ./
        with:
          zig-version: '0.17.0'
          optimize: Debug
      - name: Verify x17 on PATH
        run: |
          which x17
          x17 forms | head -5
      - name: Round-trip a bundle
        run: |
          printf 'x17.imm s5, #0x0BEE\nx17.halt\n' > /tmp/smoke.sm
          out=$(x17 asm /tmp/smoke.sm)
          echo "$out"
          echo "$out" | head -1 | grep -q '005f7017' || (echo "asm did not match silicon" && exit 1)
