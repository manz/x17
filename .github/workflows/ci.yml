name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Three jobs run side by side: the tests are the slow one (LLVM compiles every test
  # binary), so the release build, the format and reference checks and the action
  # self-test don't wait for them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - name: Run tests
        run: zig build test --summary all

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - name: Zig is formatted
        run: zig fmt --check src build.zig
      - name: Build release
        run: zig build -Doptimize=ReleaseFast
      - name: Sources are formatted
        run: zig-out/bin/x17 fmt --check examples/*.sm
      - name: Instruction reference is current
        run: zig-out/bin/x17 doc --check docs/sm1/reference.md

  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consume setup-x17 from this checkout
        uses: ./
        with:
          zig-version: '0.17.0'
      - name: Verify x17 on PATH
        run: |
          which x17
          x17 forms | head -5
      - name: Round-trip a bundle
        run: |
          printf 'x17.imm s5, #0x0BEE\nx17.halt\n' > /tmp/smoke.sm
          out=$(x17 asm /tmp/smoke.sm)
          echo "$out"
          echo "$out" | head -1 | grep -q '005f7017' || (echo "asm did not match silicon" && exit 1)
