# fact 97: x17 is a 3-syllable bundle [head, S1, S2]; S2 [31:29] picks what it does: 101 halt
# (the stop above), 000-011 continue (no visible effect with S1 = 0x31308000), 100 and 110 wedge, 111 an ALU
