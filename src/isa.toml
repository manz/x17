# sm1 proto-ISA: what the disassembler may claim, each claim with its evidence.
#
# OURS.  Every entry cites the section of fact (or the the probe list entry) that measured
# it.  `evidence` is MEASURED (a silicon run or an exact data match), INFERRED (reasoned on top), or
# GUESS (a statistical lead, printed with a trailing '?').  Nothing here is a stock syllable: forms are
# mask/value pairs over our own field split, and the table names are the AAC specification's.
#
# Field split (fact 14, from three store syllables):
#   op   [31:26]   operation class        sel  [25:21]  operand / source select (meaning OPEN)
#   addr [20:5]    16-bit data address    fmt  [4:0]    format; single flips trap or change the form

[layout]
row_syllables = 4        # one row = four 32-bit syllables (lane l of row r at 0x22020000 + l*0x4000 + r*4)
main_row = 0x40          # pass-2 program lands at row 0x40 (fact 1)
# The engine's order (fact 45, MEASURED): PC q = 8*(row/2) + 2*lane + row%2 - column-major over
# row pairs.  Instruction length from the head syllable's low5 (fact 44, MEASURED at one head;
# the only table that parses all six main programs end to end, fact 45).  [hi_low5, length].
length = [[0x01, 7], [0x02, 6], [0x03, 6], [0x04, 6], [0x0D, 1], [0x0E, 2], [0x10, 2], [0x11, 2], [0x12, 2], [0x13, 2], [0x14, 2], [0x15, 2], [0x16, 3], [0x17, 3], [0x18, 4], [0x19, 4]]
# low5 0x1A-0x1F at a head: back to the previous head (bare words only; never a head in stock code)

# Forms, first match wins.  `addr = true`: [20:5] is printed as a data address.
[[form]]
name = "st.y"
mask = "0xE000001F"
value = "0x2000000F"
addr = true
evidence = "MEASURED"
ref = "fact 14: XXXXXXXX/2002120f move their store with [20:5]; [31:29]=001 selects it"
# fact 21 (MEASURED, own syllables): the stored value is the LANE's data register (V2 for lane 2,
# V13 shared by lanes 1 and 3); sel bit 21 sets V2 and bit 22 sets V13 to the previous store's address
# before this store writes; sel 3 and bits [25:23] do nothing.
sel = "lane"

