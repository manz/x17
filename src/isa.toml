# S1[15] = 1 needed; S1[13:12] (0 a+b, 1 a, 2 a-1, 3 -a for op 0) and S1[7] (+0x8A00) OPEN as rules.
# A continuing x17 makes the NEXT run wedge unless the engine is reset (the probe list reset_after).
# own-x17alu-shl, own-x17alu-rsub.
# x17 S1 class 011 + S2 class 111: s<S1[10:7]> <- head[26:11]; S1[24/26/27] zero s1/s4/s8, S1[28] -> 0;
# enable S1[14] or S2[17], else wedge; R<S2[16:13]> written, value OPEN (fact 134, own-x17imm).
